<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
    <title>AgentWork</title>
    <link rel="stylesheet" href="connect.css">
    <script src="connect.js" defer></script>
  </head>
  <body>
    <main>
      <h1 id="title"></h1><p id="description"></p>
      <form>
        <label><span id="addressLabel"></span><input id="address" type="url" inputmode="url" autocomplete="url" required spellcheck="false" autocapitalize="none" placeholder="https://"></label>
        <label><span id="tokenLabel"></span><input id="token" type="password" autocomplete="off" autocapitalize="none" spellcheck="false"></label>
        <p id="hint"></p><p id="error" role="alert" hidden></p>
        <button type="submit"></button>
      </form>
    </main>
  </body>
</html>
